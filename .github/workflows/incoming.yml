name: Incoming → Build → Release

# Drop a project .zip into `incoming/` and push to `main`.
# The workflow replaces the whole project with the zip contents, tests and builds it on
# Windows / macOS / Linux, and only when everything succeeds commits the new state and
# publishes a GitHub Release for the version in the zip.

on:
  push:
    branches: [main]
    paths:
      - "incoming/*.zip"
  workflow_dispatch:

concurrency:
  group: incoming
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.zip.outputs.found }}
      version: ${{ steps.replace.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Locate the newest zip in incoming/
        id: zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip in incoming/ - nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest=$(printf '%s\n' "${zips[@]}" | sort -V | tail -n1)
          echo "Using $newest"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$newest" >> "$GITHUB_OUTPUT"

      - name: Replace the project with the zip contents
        if: steps.zip.outputs.found == 'true'
        id: replace
        run: |
          set -euo pipefail
          ZIP="${{ steps.zip.outputs.path }}"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$ZIP" "$RUNNER_TEMP/out/source.zip"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"

          # If the zip has a single top-level folder, use its contents.
          shopt -s dotglob nullglob
          entries=("$TMP"/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then SRC="${entries[0]}"; else SRC="$TMP"; fi
          shopt -u dotglob nullglob

          # Version: VERSION file first, then the zip file name (e.g. tileprint-0.2.0.zip).
          VERSION=""
          if [ -f "$SRC/VERSION" ]; then VERSION="$(tr -d ' \r\n' < "$SRC/VERSION")"; fi
          if [ -z "$VERSION" ]; then
            VERSION="$(basename "$ZIP" .zip | grep -oE '[0-9]+(\.[0-9]+)+' | tail -n1 || true)"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Could not determine a valid version (put it in a VERSION file or in the zip name)."
            exit 1
          fi
          # Every drop must produce a NEW release: if the tag exists, bump the last number
          # (keeping its width: 0.02 -> 0.03, 1.9 -> 1.10).
          bump() {
            local v="$1" last head
            if [[ "$v" == *.* ]]; then last="${v##*.}"; head="${v%.*}."; else last="$v"; head=""; fi
            printf '%s%0*d' "$head" "${#last}" $((10#$last + 1))
          }
          git fetch --tags --quiet origin || true
          while git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; do
            NEW="$(bump "$VERSION")"
            echo "Tag v$VERSION already exists -> using $NEW"
            VERSION="$NEW"
          done
          echo "$VERSION" > "$SRC/VERSION"
          # keep the version inside the code in sync (only when the files exist)
          if [ -f "$SRC/pyproject.toml" ]; then
            sed -i -E "0,/^version = \".*\"/s//version = \"$VERSION\"/" "$SRC/pyproject.toml"
          fi
          if [ -f "$SRC/src/tileprint/__init__.py" ]; then
            sed -i -E "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" "$SRC/src/tileprint/__init__.py"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          # Wipe the old project (keep .git, incoming/ and the workflows - see incoming/README.md).
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name incoming ! -name .github -exec rm -rf {} +
          if [ -d .github ]; then
            find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          fi
          rsync -a --exclude='.git/' --exclude='/incoming/' --exclude='/.github/workflows/' "$SRC"/ ./
          rm -f incoming/*.zip
          # the new project state travels to the next jobs as one archive
          tar --exclude=.git -czf "$RUNNER_TEMP/out/project.tgz" .

      - uses: actions/upload-artifact@v6
        if: steps.zip.outputs.found == 'true'
        with:
          name: project
          path: ${{ runner.temp }}/out/project.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: steps.zip.outputs.found == 'true'
        with:
          name: source-zip
          path: ${{ runner.temp }}/out/source.zip
          if-no-files-found: error

  test:
    needs: prepare
    if: needs.prepare.outputs.found == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: project
          path: _project
      - run: tar -xzf _project/project.tgz && rm -rf _project
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  package:
    needs: [prepare, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, name: windows, sep: ";" }
          - { os: macos-latest,   name: macos,   sep: ":" }
          - { os: ubuntu-22.04,   name: linux,   sep: ":" }
    runs-on: ${{ matrix.os }}
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: project
          path: _project
      - shell: bash
        run: tar -xzf _project/project.tgz && rm -rf _project
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build (PyInstaller, one-folder)
        shell: bash
        run: |
          EXTRA=()
          case "${{ matrix.name }}" in
            windows) EXTRA=(--icon src/tileprint/assets/icon.ico --collect-all webview --collect-all pythonnet --collect-all clr_loader) ;;
            macos)   EXTRA=(--icon src/tileprint/assets/icon.png --collect-all webview) ;;
            linux)   EXTRA=(--exclude-module gi) ;;   # Linux uses browser mode: no WebKitGTK needed in the bundle
          esac
          pyinstaller --noconfirm --windowed --name TilePrint \
            --paths src "${EXTRA[@]}" \
            --add-data "src/tileprint/assets${{ matrix.sep }}tileprint/assets" \
            --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all pikepdf \
            --exclude-module pikepdf.pdfa --exclude-module numpy --exclude-module tkinter \
            --exclude-module PIL._avif --exclude-module PIL._imagingtk --exclude-module unittest \
            --exclude-module cryptography --exclude-module PySide6 --exclude-module PyQt5 \
            --exclude-module PyQt6 --exclude-module qtpy \
            run_tileprint.py

      - name: Self-test the built app, engine (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $env:TILEPRINT_SELFTEST_LOG = "$PWD\selftest.log"
          $p = Start-Process -FilePath dist\TilePrint\TilePrint.exe -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Self-test the built app, web view (Windows)
        if: matrix.name == 'windows'
        continue-on-error: true   # needs the WebView2 runtime on the runner; informative only
        shell: pwsh
        run: |
          $env:TILEPRINT_SELFTEST_LOG = "$PWD\selftest_ui.log"
          $p = Start-Process -FilePath dist\TilePrint\TilePrint.exe -ArgumentList '--selftest','--ui' -Wait -PassThru
          if (Test-Path selftest_ui.log) { Get-Content selftest_ui.log }
          if ($p.ExitCode -ne 0) { throw "web view self-test failed (exit $($p.ExitCode))" }

      - name: Self-test the built app, engine (macOS / Linux)
        if: matrix.name != 'windows'
        shell: bash
        run: |
          BIN=dist/TilePrint/TilePrint
          [ "${{ matrix.name }}" = "macos" ] && BIN=dist/TilePrint.app/Contents/MacOS/TilePrint
          TILEPRINT_SELFTEST_LOG=selftest.log "$BIN" --selftest || { cat selftest.log || true; exit 1; }
          cat selftest.log

      - name: Self-test the built app, web view (macOS)
        if: matrix.name == 'macos'
        continue-on-error: true   # headless runners may lack a window server; informative only
        run: |
          TILEPRINT_SELFTEST_LOG=selftest_ui.log dist/TilePrint.app/Contents/MacOS/TilePrint --selftest --ui
          cat selftest_ui.log

      - name: Package (Windows portable zip)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          7z a -tzip -mx=9 "TilePrint-v$env:V-windows-portable.zip" dist/TilePrint
          7z a -t7z -mx=9 -ms=on "TilePrint-v$env:V-windows-portable.7z" dist/TilePrint

      - name: Package (macOS dmg)
        if: matrix.name == 'macos'
        run: hdiutil create -volname TilePrint -srcfolder dist/TilePrint.app -ov -format UDZO "TilePrint-v$V-macos.dmg"

      - name: Package (Linux AppImage)
        if: matrix.name == 'linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/TilePrint/* AppDir/usr/bin/
          cp src/tileprint/assets/icon.png AppDir/tileprint.png
          printf '[Desktop Entry]\nType=Application\nName=TilePrint\nExec=TilePrint\nIcon=tileprint\nCategories=Graphics;Office;\n' > AppDir/tileprint.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/TilePrint" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "TilePrint-v$V-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v6
        with:
          name: TilePrint-${{ matrix.name }}
          path: |
            TilePrint-v*-windows-portable.zip
            TilePrint-v*-windows-portable.7z
            TilePrint-v*-macos.dmg
            TilePrint-v*-linux-x86_64.AppImage
          if-no-files-found: error

  android:
    needs: prepare
    if: needs.prepare.outputs.found == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true        # an Android problem must never block the desktop release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: project
          path: _project
      - run: tar -xzf _project/project.tgz && rm -rf _project
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses (the runner already has the SDK)
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"
      - name: Engine tests (the Kotlin engine must match the desktop one)
        working-directory: android
        run: gradle :core:test --no-daemon --stacktrace
      - name: Release keystore (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK will be signed with the debug key."
          fi
      - name: Build the APK
        working-directory: android
        env:
          TP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          cp android/app/build/outputs/apk/release/app-release.apk "TilePrint-v$V-android.apk"
          ls -la TilePrint-v*-android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: TilePrint-android
          path: TilePrint-v*-android.apk
          if-no-files-found: error

  finalize:
    needs: [prepare, package, android]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: project
          path: _project

      - name: Apply the new project state
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name _project -exec rm -rf {} +
          tar -xzf _project/project.tgz
          rm -rf _project

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "release: v$V (from incoming/)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/download-artifact@v7
        with:
          pattern: TilePrint-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          name: source-zip
          path: srczip

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          cp srczip/source.zip "dist/TilePrint-v$V-source.zip"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          TAG="v$V"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG="v$V-build${{ github.run_number }}"
          fi
          # Release notes: the matching CHANGELOG section if present.
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > notes.md 2>/dev/null || true
          if [ ! -s notes.md ]; then echo "Automated release for version $V." > notes.md; fi
          gh release create "$TAG" dist/* \
            --title "TilePrint v$V" \
            --notes-file notes.md \
            --target "$(git rev-parse HEAD)"
